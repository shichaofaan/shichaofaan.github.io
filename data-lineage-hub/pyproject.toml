[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lineage-hub"
version = "0.1.0"
description = "Trace how a dimension is cleaned via DolphinScheduler, Git, and Yuque"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "data-lineage-hub" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
lineage = "lineage_hub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
